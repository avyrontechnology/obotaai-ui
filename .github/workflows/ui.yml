name: ui

on:
  push:
    paths:
      - "src/**"
      - "__tests__/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "src/**"
      - "__tests__/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npx tsc --noEmit

      - name: test
        run: npm test -- --ci
